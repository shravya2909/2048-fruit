<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2048: Fruit Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,600&family=Karla:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  /* ---------------------------------------------------------------
     PALETTE — pulled from real produce-crate materials, not a kit:
     --crate-shadow  #3E2A1D  deep espresso brown, stall backdrop at dusk
     --crate-oak     #C68B55  sun-bleached pine slats (board frame)
     --crate-oak-dk  #9C6836  grain shadow between slats
     --label-paper   #F1E2BE  aged muslin/kraft produce label
     --ink           #4A2E22  brown stamp ink for text on paper
     --cherry        #B23A2E  rubber-stamp red (low tiles, primary button)
     --citrus        #E08A24  orange/lemon mid tiles
     --plum          #5B3763  grape/kiwi high tiles, dark accents
     --vine          #6E8B3D  leaf-green accent tiles
     --gold          #D4A017  golden mango / focus ring
     --------------------------------------------------------------- */
  :root{
    --crate-shadow:#3E2A1D;
    --crate-oak:#C68B55;
    --crate-oak-dk:#9C6836;
    --label-paper:#F1E2BE;
    --ink:#4A2E22;
    --cherry:#B23A2E;
    --citrus:#E08A24;
    --plum:#5B3763;
    --vine:#6E8B3D;
    --gold:#D4A017;
    --move-duration:150ms;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #55392655 0%, transparent 60%),
      var(--crate-shadow);
    color:var(--label-paper);
    font-family:'Karla', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(14px, 4vw, 36px) 14px 40px;
  }

  .wrap{ width:100%; max-width:480px; }

  /* ---------- header: stamped label plate + hanging tags ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }

  .brand-plate{
    background:var(--label-paper);
    color:var(--ink);
    padding:10px 18px 12px;
    border-radius:6px 16px 8px 14px;
    transform:rotate(-2deg);
    box-shadow:0 4px 0 #00000022, 0 6px 10px #00000033;
    position:relative;
  }
  .brand-plate h1{
    margin:0;
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(1.9rem, 8vw, 2.6rem);
    line-height:1;
    letter-spacing:-0.02em;
  }
  .brand-stamp{
    display:inline-block;
    margin-top:6px;
    font-family:'Karla', sans-serif;
    font-weight:700;
    font-size:0.62rem;
    letter-spacing:0.06em;
    color:var(--cherry);
    border:1.5px dashed var(--cherry);
    border-radius:4px;
    padding:2px 7px;
    transform:rotate(1.5deg);
  }

  .tags{
    display:flex;
    gap:10px;
  }
  .tag{
    position:relative;
    background:var(--label-paper);
    color:var(--ink);
    padding:10px 16px 8px 20px;
    border-radius:4px 10px 10px 4px;
    min-width:74px;
    text-align:center;
    box-shadow:0 3px 0 #00000022, 0 5px 8px #00000030;
  }
  .tag::before{
    content:"";
    position:absolute;
    left:7px; top:50%;
    width:8px; height:8px;
    transform:translateY(-50%);
    border-radius:50%;
    background:var(--crate-shadow);
    box-shadow:0 0 0 2px var(--label-paper) inset;
  }
  .tag .tag-label{
    display:block;
    font-size:0.6rem;
    font-weight:700;
    letter-spacing:0.08em;
    color:var(--plum);
    margin-bottom:2px;
  }
  .tag .tag-value{
    display:block;
    font-family:'Fraunces', serif;
    font-weight:800;
    font-size:1.25rem;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .btn{
    font-family:'Karla', sans-serif;
    font-weight:800;
    font-size:0.95rem;
    color:var(--label-paper);
    background:var(--cherry);
    border:none;
    padding:10px 18px;
    border-radius:8px 14px 8px 14px;
    cursor:pointer;
    box-shadow:0 4px 0 #7a2620, 0 6px 10px #00000033;
    transition:transform 120ms ease, box-shadow 120ms ease;
  }
  .btn:hover{ filter:brightness(1.05); }
  .btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #7a2620, 0 2px 4px #00000033;
  }
  .btn:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:3px;
  }
  .btn.secondary{
    background:var(--vine);
    box-shadow:0 4px 0 #4c6128, 0 6px 10px #00000033;
  }
  .btn.secondary:active{ box-shadow:0 1px 0 #4c6128, 0 2px 4px #00000033; }

  .instructions{
    font-size:0.78rem;
    color:var(--label-paper);
    opacity:0.75;
    margin:0 0 16px;
  }

  /* ---------- crate frame + board ---------- */
  .crate{
    position:relative;
    padding:16px;
    border-radius:16px;
    background:repeating-linear-gradient(
      90deg,
      var(--crate-oak) 0px, var(--crate-oak) 34px,
      var(--crate-oak-dk) 34px, var(--crate-oak-dk) 38px
    );
    box-shadow:0 10px 0 #2a1c12, 0 16px 24px #00000055;
  }
  .bolt{
    position:absolute;
    width:11px; height:11px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #e8c78f, var(--crate-oak-dk) 70%);
    box-shadow:0 1px 2px #00000055 inset, 0 1px 1px #ffffff44;
  }
  .bolt.tl{ top:8px; left:8px; }
  .bolt.tr{ top:8px; right:8px; }
  .bolt.bl{ bottom:8px; left:8px; }
  .bolt.br{ bottom:8px; right:8px; }

  .board-inner{
    position:relative;
    aspect-ratio:1/1;
    width:100%;
    border-radius:8px;
    background:#5c3d24;
    box-shadow:inset 0 2px 10px #00000066, inset 0 0 0 6px #4a2f1c;
    overflow:hidden;
    touch-action:none;
  }

  .cells{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(4, 1fr);
    padding:3%;
    gap:3%;
  }
  .cell{
    background:#00000030;
    border-radius:8px;
    box-shadow:inset 0 2px 4px #00000040;
  }

  .tiles-layer{
    position:absolute;
    inset:0;
    padding:3%;
  }

  .tile{
    position:absolute;
    width:calc(25% - 3%);
    height:calc(25% - 3%);
    transition:left var(--move-duration) ease, top var(--move-duration) ease;
    will-change:left, top;
  }
  .tile-face{
    width:100%;
    height:100%;
    border-radius:9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 0 #00000030, 0 4px 8px #00000030, inset 0 0 0 2px #00000018;
    line-height:1;
  }
  .tile-emoji{
    font-size:clamp(1.2rem, 6.4vw, 2.15rem);
    filter:drop-shadow(0 1px 1px #00000030);
  }
  .tile-num{
    margin-top:4px;
    font-family:'Karla', sans-serif;
    font-weight:800;
    font-size:clamp(0.62rem, 3vw, 0.95rem);
    font-variant-numeric:tabular-nums;
  }

  @keyframes pop-spawn{
    0%{ transform:scale(0.3); opacity:0; }
    70%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  @keyframes pop-merge{
    0%{ transform:scale(1); }
    35%{ transform:scale(0.82, 1.18); }
    65%{ transform:scale(1.16, 0.9); }
    100%{ transform:scale(1); }
  }
  .tile-face.spawn{ animation:pop-spawn 180ms ease-out; }
  .tile-face.merge{ animation:pop-merge 220ms ease-out; }

  /* ---------- overlay ---------- */
  .overlay{
    position:absolute;
    inset:16px;
    border-radius:8px;
    background:#3e2a1dd9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 160ms ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .overlay-card{
    background:var(--label-paper);
    color:var(--ink);
    padding:26px 24px;
    border-radius:10px 20px 10px 20px;
    text-align:center;
    max-width:280px;
    box-shadow:0 8px 0 #00000022, 0 12px 20px #00000044;
  }
  .overlay-card .big-emoji{ font-size:2.6rem; display:block; margin-bottom:6px; }
  .overlay-card h2{
    font-family:'Fraunces', serif;
    font-weight:800;
    margin:0 0 6px;
    font-size:1.5rem;
  }
  .overlay-card p{ margin:0 0 18px; font-size:0.88rem; opacity:0.85; }
  .overlay-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  @media (max-width:380px){
    .brand-plate h1{ font-size:1.6rem; }
    .tag{ min-width:62px; padding:8px 10px 6px 16px; }
    .tag .tag-value{ font-size:1.05rem; }
    .btn{ padding:9px 14px; font-size:0.85rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .tile{ transition:none; }
    .tile-face.spawn, .tile-face.merge{ animation:none; }
    .overlay{ transition:none; }
    .btn{ transition:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand-plate">
        <h1>2048</h1>
        <span class="brand-stamp">FRUIT MARKET CO.</span>
      </div>
      <div class="tags">
        <div class="tag">
          <span class="tag-label">SCORE</span>
          <span class="tag-value" id="score">0</span>
        </div>
        <div class="tag">
          <span class="tag-label">BEST</span>
          <span class="tag-value" id="best">0</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="newGameBtn">New Game</button>
    </div>
    <p class="instructions">Arrow keys or swipe to slide the crate. Matching fruit combine into the next stage &mdash; grow all the way to the Golden Mango.</p>

    <div class="crate">
      <span class="bolt tl"></span><span class="bolt tr"></span>
      <span class="bolt bl"></span><span class="bolt br"></span>
      <div class="board-inner" id="board">
        <div class="cells" id="cells"></div>
        <div class="tiles-layer" id="tilesLayer"></div>

        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <span class="big-emoji" id="overlayEmoji">🥭</span>
            <h2 id="overlayTitle">You grew a Golden Mango!</h2>
            <p id="overlayText">Keep going to see how high the harvest can climb.</p>
            <div class="overlay-actions" id="overlayActions"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // -----------------------------------------------------------------
  // FRUIT PROGRESSION — lowest to highest value. Reorder or reskin by
  // editing this array only; every other line of code reads from it.
  //   value : the 2048 tile value this stage represents
  //   name  : display name (used in win message)
  //   emoji : the glyph drawn on the tile
  //   bg    : tile background color
  //   fg    : tile text/number color
  // -----------------------------------------------------------------
  const FRUITS = [
    { value:2,    name:'Cherry',       emoji:'🍒', bg:'#F1E2BE', fg:'#B23A2E' },
    { value:4,    name:'Strawberry',   emoji:'🍓', bg:'#F3D2C6', fg:'#B23A2E' },
    { value:8,    name:'Grape',        emoji:'🍇', bg:'#D8C3E0', fg:'#5B3763' },
    { value:16,   name:'Lemon',        emoji:'🍋', bg:'#F6E27A', fg:'#8a6d10' },
    { value:32,   name:'Orange',       emoji:'🍊', bg:'#F3B25E', fg:'#7a3c0a' },
    { value:64,   name:'Apple',        emoji:'🍎', bg:'#E4744A', fg:'#F1E2BE' },
    { value:128,  name:'Pear',         emoji:'🍐', bg:'#B7C97C', fg:'#3f4d1f' },
    { value:256,  name:'Pineapple',    emoji:'🍍', bg:'#E8A93A', fg:'#4a2e10' },
    { value:512,  name:'Watermelon',   emoji:'🍉', bg:'#6E8B3D', fg:'#F1E2BE' },
    { value:1024, name:'Kiwi',         emoji:'🥝', bg:'#4C6128', fg:'#F1E2BE' },
    { value:2048, name:'Golden Mango', emoji:'🥭', bg:'#D4A017', fg:'#3E2A1D' },
  ];
  const WIN_VALUE = FRUITS[FRUITS.length - 1].value;
  const FRUIT_BY_VALUE = new Map(FRUITS.map(f => [f.value, f]));

  function fruitFor(value){
    return FRUIT_BY_VALUE.get(value) || FRUITS[FRUITS.length - 1];
  }

  // -----------------------------------------------------------------
  // state
  // -----------------------------------------------------------------
  const SIZE = 4;
  const BEST_KEY = 'fruit2048-best';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOVE_MS = reduceMotion ? 0 : 150;

  let cells = [];        // SIZE x SIZE, each null or {id, value}
  let idCounter = 0;
  let score = 0;
  let best = Number(localStorage.getItem(BEST_KEY)) || 0;
  let hasWon = false;
  let keepPlaying = false;
  let inputLocked = false;

  const tileEls = new Map(); // id -> DOM element

  const boardEl = document.getElementById('board');
  const cellsEl = document.getElementById('cells');
  const tilesLayerEl = document.getElementById('tilesLayer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlayEl = document.getElementById('overlay');
  const overlayEmojiEl = document.getElementById('overlayEmoji');
  const overlayTitleEl = document.getElementById('overlayTitle');
  const overlayTextEl = document.getElementById('overlayText');
  const overlayActionsEl = document.getElementById('overlayActions');

  function makeId(){ return 't' + (idCounter++); }

  function emptyGrid(){
    const g = [];
    for(let r=0;r<SIZE;r++){ g.push(new Array(SIZE).fill(null)); }
    return g;
  }

  function withinBounds(r,c){ return r>=0 && r<SIZE && c>=0 && c<SIZE; }

  // -----------------------------------------------------------------
  // static background cells (drawn once)
  // -----------------------------------------------------------------
  function buildCells(){
    cellsEl.innerHTML = '';
    for(let i=0;i<SIZE*SIZE;i++){
      const d = document.createElement('div');
      d.className = 'cell';
      cellsEl.appendChild(d);
    }
  }

  // -----------------------------------------------------------------
  // tile DOM helpers
  // -----------------------------------------------------------------
  function positionStyle(row,col){
    return { left:(col*25)+'%', top:(row*25)+'%' };
  }

  function createTileEl(tile, row, col, animClass){
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.id = tile.id;
    const pos = positionStyle(row,col);
    el.style.left = pos.left;
    el.style.top = pos.top;

    const face = document.createElement('div');
    face.className = 'tile-face' + (animClass ? ' ' + animClass : '');
    const f = fruitFor(tile.value);
    face.style.background = f.bg;
    face.style.color = f.fg;

    const emoji = document.createElement('span');
    emoji.className = 'tile-emoji';
    emoji.textContent = f.emoji;

    const num = document.createElement('span');
    num.className = 'tile-num';
    num.textContent = tile.value;

    face.appendChild(emoji);
    face.appendChild(num);
    el.appendChild(face);
    tilesLayerEl.appendChild(el);
    tileEls.set(tile.id, el);
    return el;
  }

  function moveTileEl(id, row, col){
    const el = tileEls.get(id);
    if(!el) return;
    const pos = positionStyle(row,col);
    el.style.left = pos.left;
    el.style.top = pos.top;
  }

  function removeTileEl(id){
    const el = tileEls.get(id);
    if(el){ el.remove(); }
    tileEls.delete(id);
  }

  // -----------------------------------------------------------------
  // game setup
  // -----------------------------------------------------------------
  function resetGame(){
    cells = emptyGrid();
    tileEls.forEach(el => el.remove());
    tileEls.clear();
    score = 0;
    hasWon = false;
    keepPlaying = false;
    inputLocked = false;
    hideOverlay();
    updateScoreDisplay();
    const t1 = spawnRandomTile();
    const t2 = spawnRandomTile();
    if(t1) createTileEl(t1.tile, t1.row, t1.col, 'spawn');
    if(t2) createTileEl(t2.tile, t2.row, t2.col, 'spawn');
  }

  function spawnRandomTile(){
    const empties = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){ if(!cells[r][c]) empties.push({r,c}); }
    if(empties.length === 0) return null;
    const spot = empties[Math.floor(Math.random()*empties.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    const tile = { id:makeId(), value };
    cells[spot.r][spot.c] = tile;
    return { tile, row:spot.r, col:spot.c };
  }

  // -----------------------------------------------------------------
  // movement
  // -----------------------------------------------------------------
  const DIRS = {
    ArrowUp:    { dr:-1, dc:0 },
    ArrowDown:  { dr:1,  dc:0 },
    ArrowLeft:  { dr:0,  dc:-1 },
    ArrowRight: { dr:0,  dc:1 },
  };

  function buildTraversalOrder(vector){
    let rows = [0,1,2,3];
    let cols = [0,1,2,3];
    if(vector.dr === 1) rows = rows.slice().reverse();
    if(vector.dc === 1) cols = cols.slice().reverse();
    return { rows, cols };
  }

  function findFarthest(row,col,vector){
    let prevR=row, prevC=col;
    let nextR=row+vector.dr, nextC=col+vector.dc;
    while(withinBounds(nextR,nextC) && !cells[nextR][nextC]){
      prevR=nextR; prevC=nextC;
      nextR+=vector.dr; nextC+=vector.dc;
    }
    return { farthest:{row:prevR,col:prevC}, next:{row:nextR,col:nextC} };
  }

  function move(vector){
    const { rows, cols } = buildTraversalOrder(vector);
    const movements = [];   // tiles that keep their id, just change position
    const removals = [];    // ids removed after animating into a merge
    const creations = [];   // merged-result tiles to add after animation
    let moved = false;
    let scoreGained = 0;
    let wonThisMove = false;

    for(const row of rows){
      for(const col of cols){
        const tile = cells[row][col];
        if(!tile) continue;
        const { farthest, next } = findFarthest(row,col,vector);
        const nextTile = withinBounds(next.row,next.col) ? cells[next.row][next.col] : null;

        if(nextTile && nextTile.value === tile.value && !nextTile.mergedThisTurn){
          const mergedValue = tile.value * 2;
          const newTile = { id:makeId(), value:mergedValue, mergedThisTurn:true };
          cells[next.row][next.col] = newTile;
          cells[row][col] = null;
          movements.push({ id:tile.id, toRow:next.row, toCol:next.col });
          removals.push(tile.id, nextTile.id);
          creations.push({ id:newTile.id, value:mergedValue, row:next.row, col:next.col });
          scoreGained += mergedValue;
          moved = true;
          if(mergedValue === WIN_VALUE) wonThisMove = true;
        } else if(farthest.row !== row || farthest.col !== col){
          cells[farthest.row][farthest.col] = tile;
          cells[row][col] = null;
          movements.push({ id:tile.id, toRow:farthest.row, toCol:farthest.col });
          moved = true;
        }
      }
    }

    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){ if(cells[r][c]) cells[r][c].mergedThisTurn = false; }

    return { moved, movements, removals, creations, scoreGained, wonThisMove };
  }

  function canMoveExists(){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const t = cells[r][c];
        if(!t) return true;
        for(const key of ['ArrowRight','ArrowDown']){
          const v = DIRS[key];
          const nr=r+v.dr, nc=c+v.dc;
          if(withinBounds(nr,nc) && cells[nr][nc] && cells[nr][nc].value === t.value) return true;
        }
      }
    }
    return false;
  }

  function updateScoreDisplay(){
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function handleMove(vector){
    if(inputLocked) return;
    const result = move(vector);
    if(!result.moved) return;

    inputLocked = true;

    // slide continuing tiles (and the tiles that are about to merge away)
    for(const m of result.movements){ moveTileEl(m.id, m.toRow, m.toCol); }

    score += result.scoreGained;
    if(score > best){ best = score; localStorage.setItem(BEST_KEY, String(best)); }
    updateScoreDisplay();

    setTimeout(() => {
      for(const id of result.removals){ removeTileEl(id); }
      for(const creation of result.creations){
        createTileEl({ id:creation.id, value:creation.value }, creation.row, creation.col, 'merge');
      }
      const spawned = spawnRandomTile();
      if(spawned){ createTileEl(spawned.tile, spawned.row, spawned.col, 'spawn'); }

      if(result.wonThisMove && !hasWon){
        hasWon = true;
        showWinOverlay();
        return; // stays locked until user chooses an overlay action
      }
      if(!canMoveExists()){
        showGameOverOverlay();
        return;
      }
      inputLocked = false;
    }, MOVE_MS);
  }

  // -----------------------------------------------------------------
  // overlays
  // -----------------------------------------------------------------
  function hideOverlay(){
    overlayEl.classList.remove('show');
    overlayActionsEl.innerHTML = '';
  }

  function showWinOverlay(){
    overlayEmojiEl.textContent = fruitFor(WIN_VALUE).emoji;
    overlayTitleEl.textContent = 'You grew a ' + fruitFor(WIN_VALUE).name + '!';
    overlayTextEl.textContent = 'Keep going to see how high the harvest can climb.';
    overlayActionsEl.innerHTML = '';
    const keepBtn = document.createElement('button');
    keepBtn.className = 'btn secondary';
    keepBtn.textContent = 'Keep Growing';
    keepBtn.addEventListener('click', () => {
      keepPlaying = true;
      hideOverlay();
      inputLocked = false;
    });
    const newBtn = document.createElement('button');
    newBtn.className = 'btn';
    newBtn.textContent = 'New Game';
    newBtn.addEventListener('click', resetGame);
    overlayActionsEl.appendChild(keepBtn);
    overlayActionsEl.appendChild(newBtn);
    overlayEl.classList.add('show');
  }

  function showGameOverOverlay(){
    overlayEmojiEl.textContent = '🧺';
    overlayTitleEl.textContent = 'The Crate is Full!';
    overlayTextEl.textContent = 'No more moves left. Final score: ' + score + '.';
    overlayActionsEl.innerHTML = '';
    const newBtn = document.createElement('button');
    newBtn.className = 'btn';
    newBtn.textContent = 'Try Again';
    newBtn.addEventListener('click', resetGame);
    overlayActionsEl.appendChild(newBtn);
    overlayEl.classList.add('show');
    inputLocked = true;
  }

  // -----------------------------------------------------------------
  // input
  // -----------------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    if(!(e.key in DIRS)) return;
    e.preventDefault();
    handleMove(DIRS[e.key]);
  });

  let touchStartX = 0, touchStartY = 0;
  boardEl.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive:true });

  boardEl.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    let vector;
    if(Math.abs(dx) > Math.abs(dy)) vector = dx > 0 ? DIRS.ArrowRight : DIRS.ArrowLeft;
    else vector = dy > 0 ? DIRS.ArrowDown : DIRS.ArrowUp;
    handleMove(vector);
  }, { passive:true });

  document.getElementById('newGameBtn').addEventListener('click', resetGame);

  // -----------------------------------------------------------------
  // boot
  // -----------------------------------------------------------------
  buildCells();
  updateScoreDisplay();
  resetGame();
})();
</script>
</body>
</html>
